{% extends 'base.html' %}

{% block title %}Mercado Pago · RABIA{% endblock %}

{% block content %}
<div class="rb-contenedor rb-pagina">
    <div class="rb-simple">
        <section class="rb-card rb-card--naranja rb-card--padding">
            <h1 class="rb-h2 rb-card__titulo">Pasarela <span class="rb-naranja">Mercado Pago</span></h1>
            <p>Monto de prueba: <strong>$ {{ monto }}</strong></p>
            <img class="rb-qr" src="{{ qr_data_uri }}" alt="Código QR de prueba de Mercado Pago">
            <a href="{{ init_point }}" target="_blank" rel="noopener" class="rb-btn rb-btn--ancho">Abrir Mercado Pago</a>
            <p class="rb-espacio-arriba"><a href="{% url 'metodos_pago' %}">Volver a medios de pago</a></p>
        </section>
    </div>
</div>
{% endblock %}
